name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Materialize keystore.properties + the signing keystore from repo secrets.
      # Skipped when secrets are absent (e.g. fork builds), which leaves the
      # build.gradle.kts debug-signing fallback intact.
      - name: Restore release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Signing secrets not configured; falling back to debug signing."
            exit 0
          fi
          echo "storeFile=f2shhh-release.jks" > keystore.properties
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> keystore.properties
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > f2shhh-release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/f2shhh-${GITHUB_REF_NAME}-release.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
